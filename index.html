    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pointscape</title>
    <meta
      name="description"
      content="A flat 2D puzzle. Tap an arrow whose path is clear and it slides away. 1,000 levels across 5 board sizes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pointscape" />
    <meta
      property="og:description"
      content="Tap arrows. Clear the board. An arrow puzzle with 1,000 levels."

    <style>
      /* Same file the app bundle loads, so the splash and the game use one download. */
      @font-face {
        font-family: 'Fredoka Variable';
        font-style: normal;
        font-display: block;
        font-weight: 300 700;
        src: url('@fontsource-variable/fredoka/files/fredoka-latin-wght-normal.woff2')
          format('woff2-variations');
      }
      /* Colours match the slate scale of each theme in src/index.css. */
      #splash {
        --sp-bg: #f1f5f9;
        --sp-faint: #e2e8f0;
        --sp-panel: #e2e8f0;
        --sp-line: #94a3b8;
        --sp-track: #ffffff;
        --sp-ink: #1e293b;
        background: var(--sp-bg);
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
        font:
          700 18px/1.2 'Fredoka Variable',
          Roboto,
          system-ui,
          sans-serif;
        background-image: radial-gradient(
          circle,
          var(--sp-faint) 1.6px,
          transparent 1.8px
        );
        background-size: 44px 44px;
      }
      #splash-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 448px;
        padding: 0 20px;
        box-sizing: border-box;
      }
      #splash-logo {
        margin: 0;
        font-size: 40px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.025em;
        color: var(--sp-ink);
      }
      #splash-board {
        width: 100%;
        max-width: 336px;
        overflow: hidden;
        box-sizing: border-box;
        border-radius: 24px;
        border: 1px solid var(--sp-line);
        background: var(--sp-panel);
        box-shadow: 0 12px 26px rgb(0 0 0 / 0.35);
      }
      #splash-board svg {
        display: block;
        width: 100%;
      }
      #splash-board circle {
        fill: var(--sp-line);
      }
      .sa {
        animation: splash-arrow 4.2s cubic-bezier(0.5, 0, 0.8, 0.4) infinite;
      }
      #splash p {
        margin: 0;
        text-align: center;
      }
      #splash-title {
        font-size: 20px;
        font-weight: 800;
        color: var(--sp-ink);
      }
      #splash-bar {
        width: 260px;
        height: 10px;
        overflow: hidden;
        box-sizing: border-box;
        border-radius: 99px;
        border: 1px solid var(--sp-line);
        background: var(--sp-track);
      }
      #splash-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          #00f5d0,
          #5b6bff,
          #ff2bd6,
          #ff8a00,
          #ffe600
        );
        animation: splash-bar 1.4s ease-in-out infinite;
      }
      html[data-theme='dark'] #splash {
        --sp-bg: #020617;
        --sp-faint: #1e293b;
        --sp-panel: #1e293b;
        --sp-line: #475569;
        --sp-track: #0f172a;
        --sp-ink: #e2e8f0;
      }
      @keyframes splash-arrow {
        0%,
        12% {
          transform: translate(0, 0);
          opacity: 1;
        }
        38% {
          transform: translate(var(--dx), var(--dy));
          opacity: 1;
        }
        39%,
        86% {
          transform: translate(var(--dx), var(--dy));
          opacity: 0;
        }
        87% {
          transform: translate(0, 0);
          opacity: 0;
        }
        100% {
          transform: translate(0, 0);
          opacity: 1;
        }
      }
      @keyframes splash-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sa,
        #splash-bar i {
          animation: none;
        }
      }
    </style>
  </head>

    <script>
      // Pick the saved theme before the first paint, so there is no light flash in dark mode.
      // Key and shape must match STORAGE_KEY and the settings in src/game/storage.ts.
      try {
        var t = JSON.parse(localStorage.getItem('pointscape:v1') || '{}')
          .settings.theme;
        if (t === 'dark' || t === 'light')
          document.documentElement.dataset.theme = t;
      } catch (e) {}
      var dk = document.documentElement.dataset.theme === 'dark';
      document.documentElement.style.background = dk ? '#020617' : '#f1f5f9';
    </script>
